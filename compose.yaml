name: our-garden

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - garden_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  garden_data:
