# Temporary HTTP-only configuration used to issue the first certificate.
server {
    listen 80;
    server_name cyberhome.wuhuxiaoshu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/our-garden-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Our Garden is being prepared.\n";
    }
}
