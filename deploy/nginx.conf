server {
    listen 80;
    server_name cyberhome.wuhuxiaoshu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/our-garden-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name cyberhome.wuhuxiaoshu.com;
    ssl_certificate /etc/letsencrypt/live/cyberhome.wuhuxiaoshu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberhome.wuhuxiaoshu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;
    access_log /www/wwwlogs/cyberhome.wuhuxiaoshu.com.access.log;
    error_log /www/wwwlogs/cyberhome.wuhuxiaoshu.com.error.log;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
